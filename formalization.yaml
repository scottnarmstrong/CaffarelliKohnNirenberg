# Metadata schema version.
version: "v0.4"

project:
  name: "CaffarelliKohnNirenberg"
  description: >-
    A Lean 4 / Mathlib formalization of the Caffarelli-Kohn-Nirenberg partial
    regularity theory for suitable weak solutions of the three-dimensional
    incompressible Navier-Stokes equations with forcing in L^q, q > 5/2: the L^3
    epsilon-regularity theorem (Theorem A), the gradient epsilon-regularity
    criterion (Theorem B) and the vanishing of the one-dimensional parabolic
    Hausdorff measure of the singular set (Theorem C). The three theorems are
    proved using only the standard axioms, restated together in a Mathlib-only comparator challenge and proved from
    the library theorems. The manuscript being formalized is in the
    repository and was corrected alongside the development.
  authors:
    - "Scott Armstrong"
    - "Vlad Vicol"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Vlad Vicol"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
    - "Vlad Vicol: Department of Mathematics, Courant Institute School of Mathematics, Computing, and Data Science, New York University"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."
    - "Vlad Vicol was partially supported by the Collaborative NSF grant DMS-2307681 and by a Simons Investigator Award."

