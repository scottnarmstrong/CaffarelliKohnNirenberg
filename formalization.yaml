status:
  scope: >-
    Complete for the three main theorems as stated in the manuscript (Theorems
    2.7, 2.9 and 2.10 there): suitable weak solutions on an open product domain
    in space-time, force in L^q_loc with q > 5/2 and not necessarily divergence
    free, regular points defined by an almost-everywhere equal parabolically
    Hölder representative, and the singular set measured by the one-dimensional
    parabolic Hausdorff measure in the diameter gauge. The supporting library
    (about 250,000 lines) contains Sobolev spaces and weak
    derivatives, mollification, Newtonian and heat potentials, Morrey and
    Campanato norms, the pressure theory and the parabolic Vitali covering. An
    explicit nonzero suitable weak solution (a viscous shear flow) shows the
    solution class is inhabited. The formalization does not cover every
    supporting statement in the manuscript. In particular, its H²₀/Z-space
    construction, time-derivative and weak-time-continuity route, and the
    associated Pettis and du Bois-Reymond inputs are unused and not formalized
    here. These omissions, the unused compactness route, and the distinction
    between general qualitative and specialized quantitative estimates are
    described in docs/DEVIATIONS.md and docs/DESIGN_NOTES.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
