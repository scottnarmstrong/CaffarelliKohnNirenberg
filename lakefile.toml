name = "CKN"
version = "1.0.0"
defaultTargets = ["CKN"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

# Main library, including the three theorem statements and their proofs.
[[lean_lib]]
name = "CKN"
globs = ["CKN"]
leanOptions = { autoImplicit = false, warningAsError = true }

# All tracked modules, including auxiliary results and examples.
# scripts/build_all.py generates the import file.
[[lean_lib]]
name = "CKNAll"
globs = ["CKNAll"]
leanOptions = { autoImplicit = false, warningAsError = true }

# Independent theorem statements and their proofs from the library.
# Each Challenge has one intentional sorry; check_comparators.py verifies
# that this is its only warning and checks each Solution with warnings as errors.
[[lean_lib]]
name = "Comparators"
globs = ["comparators.+"]
leanOptions = { autoImplicit = false }
